name: pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy browser player
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Compile the ZX Spectrum 128K TAP with z88dk
        # Same pattern as ci.yml: the build runs inside the official z88dk
        # image (which has no python3), the layout check runs on the host.
        run: >
          docker run --rm -v "$PWD":/src -w /src z88dk/z88dk:latest
          make zx128 CHECK_ZX128_LAYOUT=:

      - name: Validate ZX128 memory layout
        run: |
          set -eu
          map_files=(build/*-zx128k.map)
          test "${#map_files[@]}" -eq 1
          tools/check_zx128_layout.py "${map_files[0]}"

      - name: Assemble the site
        run: |
          set -eu
          tap_files=(build/aw-*-zx128k.tap)
          test "${#tap_files[@]}" -eq 1
          mkdir -p _site
          cp -R site/. _site/
          cp "${tap_files[0]}" _site/attribute-wars.tap

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
