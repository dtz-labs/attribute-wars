name: pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  # The dtz-labs fork of JSSpeccy 3 (Timex video modes, gamepad support);
  # the pages deploy downloads this pinned release instead of vendoring a
  # build into the repository.
  JSSPECCY_RELEASE: v3.2.0-timex.2

jobs:
  deploy:
    name: deploy browser player
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Compile every platform TAP with z88dk
        # Same pattern as ci.yml: the build runs inside the official z88dk
        # image (which has no python3), the layout checks run on the host.
        run: >
          docker run --rm -v "$PWD":/src -w /src z88dk/z88dk:latest
          make all CHECK_ZX128_LAYOUT=: CHECK_ZX_STACK_LAYOUT=:

      - name: Validate ZX stack layout
        run: |
          set -eu
          tools/check_zx_stack_layout.py build/*-timex.map
          tools/check_zx_stack_layout.py build/*-zx48k.map

      - name: Validate ZX128 memory layout
        run: |
          set -eu
          map_files=(build/*-zx128k.map)
          test "${#map_files[@]}" -eq 1
          tools/check_zx128_layout.py "${map_files[0]}"

      - name: Download the emulator build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p _emulator
          gh release download "$JSSPECCY_RELEASE" \
            --repo dtz-labs/jsspeccy3 \
            --pattern jsspeccy-dist.zip \
            --output _emulator/jsspeccy-dist.zip
          unzip -q _emulator/jsspeccy-dist.zip -d _emulator/dist

      - name: Assemble the site
        run: |
          set -eu
          mkdir -p _site
          cp -R site/. _site/
          cp -R _emulator/dist/jsspeccy _site/jsspeccy
          cp build/aw-*-timex.tap _site/aw-timex.tap
          cp build/aw-*-zx128k.tap _site/aw-zx128k.tap
          cp build/aw-*-zx48k.tap _site/aw-zx48k.tap

      - name: Check the pieces the page needs are all there
        run: |
          set -eu
          test -f _site/index.html
          test -f _site/aw-timex.tap
          test -f _site/aw-zx128k.tap
          test -f _site/aw-zx48k.tap
          test -f _site/jsspeccy/jsspeccy.js
          test -f _site/jsspeccy/jsspeccy-core.wasm
          test -f _site/jsspeccy/roms/tc2048.rom
          test -f _site/jsspeccy/roms/2068-home.rom
          test -f _site/jsspeccy/tapeloaders/tape_2048.szx
          test -f _site/jsspeccy/tapeloaders/tape_2068.szx

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
